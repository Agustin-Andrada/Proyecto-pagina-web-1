<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complejo Deportivo</title>
    <link rel="stylesheet" href="css/estilos.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="contacto-page">
    <header>
      <h1>Complejo Deportivo Papa Francisco</h1>
      <nav>
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="nosotros.html">Nosotros</a></li>
          <li><a href="torneos.html">Torneos</a></li>
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="contacto-box">
        <h2>Contacto</h2>
        <p>📍 Merlo, Buenos Aires</p>
        <p>📞 11-1234-5678</p>

        <form>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" placeholder="Nombre" required />

          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Email" required />

          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" placeholder="Mensaje" required></textarea>

          <button type="submit">Enviar</button>
        </form>
      </div>
    </main>

    <footer>
      <p>© 2026 Complejo Deportivo</p>
    </footer>
  </body>
</html>
